name: Build Unsigned IPA

on:
  workflow_dispatch:
    inputs:
      scheme:
        description: 'Xcode scheme name'
        required: true
        default: 'beu'
      configuration:
        description: 'Build configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
      project_path:
        description: 'Path to .xcodeproj (relative to repo root)'
        required: true
        default: 'ThreeOneOSFive.xcodeproj'
      app_name:
        description: 'App product name (without .app)'
        required: true
        default: 'beu'

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: List schemes
        run: |
          xcodebuild -project "${{ inputs.project_path }}" -list || true

      - name: Build (unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project "${{ inputs.project_path }}" \
            -scheme "${{ inputs.scheme }}" \
            -configuration "${{ inputs.configuration }}" \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_NAME="${{ inputs.app_name }}"
          CONFIG="${{ inputs.configuration }}"
          APP_PATH="build/Build/Products/${CONFIG}-iphoneos/${APP_NAME}.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "Khong tim thay: $APP_PATH"
            find build -type d -name "*.app" 2>/dev/null || true
            exit 1
          fi

          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Info.plist" 2>/dev/null || echo "0.0.0")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_PATH/Info.plist" 2>/dev/null || echo "0")
          IPA_NAME="${APP_NAME}-${VERSION}-${BUILD}-${CONFIG}-unsigned.ipa"

          zip -qr "$IPA_NAME" Payload
          ls -lh "$IPA_NAME"
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name }}-${{ inputs.configuration }}-unsigned-ipa
          path: "*.ipa"
          retention-days: 14
          if-no-files-found: error